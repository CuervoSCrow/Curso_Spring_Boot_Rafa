 # Configuracion de la base de datos H2
spring.datasource.url=jdbc:h2:tcp://localhost/test;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Configuración de JPA Hibernate
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Inicialización de la base de datos
# Espere a que se inicialice la base de datos antes de crear el datasource
spring.jpa.defer-datasource-initilization=true
# Se debe ejecutar la inicialización de la bd cada que se ejecute
spring.sql.init.mode=always


